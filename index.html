<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Consistency Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
        color: #1f2937;
      }

      /* Heatmap Styles */
      .heatmap-grid {
        display: grid;
        grid-template-rows: repeat(7, 1fr);
        grid-auto-flow: column;
        gap: 4px;
      }
      .day-square {
        width: 14px;
        height: 14px;
        background-color: #ebedf0;
        border-radius: 3px;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
        position: relative;
      }
      .day-square:hover {
        transform: scale(1.2);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        z-index: 10;
      }
      .day-square.active-1 {
        background-color: #9be9a8;
      }
      .day-square.active-2 {
        background-color: #40c463;
      }
      .day-square.active-3 {
        background-color: #30a14e;
      }
      .day-square.active-4 {
        background-color: #216e39;
      }

      /* Custom Tooltip */
      #tooltip {
        position: absolute;
        background: #24292f;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 50;
        white-space: nowrap;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transform: translate(-50%, -100%);
        margin-top: -8px;
      }
      #tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: #24292f transparent transparent transparent;
      }

      /* Scrollbar for heatmap container */
      .heatmap-container {
        overflow-x: auto;
        padding-bottom: 1rem;
        scrollbar-width: thin;
      }
      .heatmap-container::-webkit-scrollbar {
        height: 6px;
      }
      .heatmap-container::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 3px;
      }

      /* Loader */
      .loader {
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top: 3px solid #3b82f6;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="min-h-screen py-8 px-4 sm:px-8">
    <div class="max-w-5xl mx-auto space-y-8">
      <!-- Header -->
      <header
        class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100"
      >
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Learning Tracker</h1>
          <p class="text-sm text-gray-500 mt-1">
            Consistency is the key to mastery.
          </p>
        </div>
        <div
          id="status-indicator"
          class="flex items-center text-sm text-gray-500"
        >
          <div class="loader mr-2" id="loading-spinner"></div>
          <span id="status-text">Connecting...</span>
        </div>
      </header>

      <!-- Heatmap Section -->
      <section
        class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 relative"
      >
        <h2 class="text-lg font-semibold mb-4 text-gray-700">
          Contribution Activity (Last 365 Days)
        </h2>
        <div class="heatmap-container relative" id="heatmap-scroll-area">
          <div class="flex gap-4">
            <!-- Days of week labels -->
            <div
              class="flex flex-col justify-between text-xs text-gray-400 py-1"
              style="height: 122px"
            >
              <span>Mon</span>
              <span>Wed</span>
              <span>Fri</span>
            </div>
            <!-- Heatmap Grid -->
            <div id="heatmap" class="heatmap-grid pb-2"></div>
          </div>
        </div>
        <div id="tooltip"></div>

        <div
          class="flex items-center justify-end text-xs text-gray-500 mt-2 gap-2"
        >
          <span>Less</span>
          <div class="w-3 h-3 rounded-sm bg-[#ebedf0]"></div>
          <div class="w-3 h-3 rounded-sm bg-[#9be9a8]"></div>
          <div class="w-3 h-3 rounded-sm bg-[#40c463]"></div>
          <div class="w-3 h-3 rounded-sm bg-[#30a14e]"></div>
          <div class="w-3 h-3 rounded-sm bg-[#216e39]"></div>
          <span>More</span>
        </div>
      </section>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Form Section -->
        <section
          class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit"
        >
          <h2 class="text-lg font-semibold mb-4 text-gray-700">Log Activity</h2>
          <form id="log-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Date</label
              >
              <input
                type="date"
                id="log-date"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Course Name</label
              >
              <input
                type="text"
                id="log-course"
                placeholder="e.g., React, Python"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Topic Covered</label
              >
              <input
                type="text"
                id="log-topic"
                placeholder="e.g., Hooks, Loops"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Notes (Optional)</label
              >
              <textarea
                id="log-notes"
                rows="3"
                placeholder="Brief summary..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"
              ></textarea>
            </div>
            <button
              type="submit"
              id="submit-btn"
              class="w-full bg-gray-900 text-white font-medium py-2.5 rounded-lg hover:bg-gray-800 transition shadow-sm flex justify-center items-center"
            >
              Save Log
            </button>
          </form>
        </section>

        <!-- Recent Logs Section -->
        <section
          class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100"
        >
          <h2 class="text-lg font-semibold mb-4 text-gray-700">Recent Logs</h2>
          <div
            id="logs-container"
            class="space-y-4 max-h-[500px] overflow-y-auto pr-2"
          >
            <p class="text-gray-500 text-sm italic">Loading logs...</p>
          </div>
        </section>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="toast"
      class="fixed bottom-4 right-4 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3"
    >
      <svg
        class="w-5 h-5 text-green-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
      <span id="toast-msg">Activity logged successfully!</span>
    </div>

    <script type="module">
      // Import Firebase app
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

      // Import Firestore (The Database)
      import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        query,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

      // Your Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyB3ZLk2sK28LY0OP727Kpxu0xsCrfZksYs",
        authDomain: "learning-tracker-9a1e1.firebaseapp.com",
        projectId: "learning-tracker-9a1e1",
        storageBucket: "learning-tracker-9a1e1.firebasestorage.app",
        messagingSenderId: "933272881617",
        appId: "1:933272881617:web:f9541d767ce37c77e9b8f0",
        measurementId: "G-MJTQYNYE5H",
      };

      // Initialize Firebase and Firestore
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // --- YOUR APP LOGIC STARTS HERE ---

      // Handle form submission
      document
        .getElementById("log-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const course = document.getElementById("course").value;
          const topic = document.getElementById("topic").value;
          const date = new Date().toISOString();

          try {
            await addDoc(collection(db, "logs"), {
              course: course,
              topic: topic,
              timestamp: date,
            });
            document.getElementById("topic").value = ""; // clear input
            loadLogs(); // refresh the data
          } catch (e) {
            console.error("Error adding document: ", e);
            alert("Error saving your log. Check console for details.");
          }
        });

      // Load logs and generate heatmap
      async function loadLogs() {
        const logsList = document.getElementById("recent-logs");
        logsList.innerHTML = "Loading...";

        const q = query(collection(db, "logs"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);

        logsList.innerHTML = ""; // clear loading text
        const trackerGrid = document.getElementById("tracker-grid");
        trackerGrid.innerHTML = ""; // clear old grid

        let logsData = [];

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          logsData.push(data);

          // Add to recent logs list
          const li = document.createElement("li");
          const logDate = new Date(data.timestamp).toLocaleDateString();
          li.innerHTML = `<strong>${data.course}</strong>: ${data.topic} <em>(${logDate})</em>`;
          logsList.appendChild(li);
        });

        // Generate Heatmap (Last 30 days)
        for (let i = 29; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateString = d.toLocaleDateString();

          const box = document.createElement("div");
          box.classList.add("day-box");
          box.title = dateString;

          // Check if any log matches this date
          const hasActivity = logsData.some(
            (log) =>
              new Date(log.timestamp).toLocaleDateString() === dateString,
          );

          if (hasActivity) {
            box.classList.add("active");
          }

          trackerGrid.appendChild(box);
        }
      }

      // Load data on startup
      loadLogs();
    </script>
  </body>
</html>
