  <style>
    :root {
      --ink: #07110f;
      --panel: #10211d;
      --panel-deep: #0b1815;
      --line: rgba(192, 242, 217, .13);
      --text: #eefbf5;
      --muted: #94aea4;
      --mint: #6ef2b6;
      --emerald: #19c77c;
      --aqua: #55dfc1;
      --field: rgba(2, 12, 9, .47);
      --shadow: 0 24px 70px rgba(0, 0, 0, .24);
    }

    body.light-mode {
      --ink: #e8f4ef;
      --panel: #f8fffb;
      --panel-deep: #eef9f4;
      --line: rgba(16, 91, 65, .14);
      --text: #0c2620;
      --muted: #607c70;
      --mint: #087a50;
      --emerald: #06945d;
      --aqua: #087a6d;
      --field: #f2fbf6;
      --shadow: 0 20px 55px rgba(25, 71, 54, .11);
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      margin: 0;
      background: var(--ink);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      transition: background .35s ease, color .35s ease;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% -8%, rgba(25, 199, 124, .20), transparent 32rem),
        radial-gradient(circle at 93% 28%, rgba(85, 223, 193, .10), transparent 30rem),
        var(--ink);
    }

    .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .33;
      background-image:
        linear-gradient(rgba(164, 255, 212, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(164, 255, 212, .045) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }

    .page-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px;
    }

    .brand-font { font-family: "Space Grotesk", sans-serif; }
    .mono-font { font-family: "Space Mono", monospace; }

    .surface {
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .panel {
      border-radius: 24px;
    }

    .dashboard-card {
      position: relative;
      overflow: hidden;
    }

    .dashboard-card::after {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      top: -38px;
      right: -32px;
      border-radius: 50%;
      background: rgba(110, 242, 182, .10);
      filter: blur(2px);
    }

    .brand-mark {
      box-shadow: 0 0 0 6px rgba(110, 242, 182, .07), 0 0 32px rgba(25, 199, 124, .32);
    }

    .logo-mark {
      animation: logoFloat 4s ease-in-out infinite;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .logo-mark:hover {
      transform: rotate(-4deg) scale(1.06);
      box-shadow: 0 0 0 8px rgba(110, 242, 182, .10), 0 0 40px rgba(25, 199, 124, .42);
    }

    .logo-svg { width: 29px; height: 29px; }

    .dashboard-card {
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-4px);
      border-color: rgba(110, 242, 182, .30);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .30);
    }

    .subject-chip { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
    .subject-chip:hover { transform: translateY(-2px); background: rgba(25, 199, 124, .19); border-color: rgba(110, 242, 182, .42); }
    button { transition: transform .2s ease, filter .2s ease, border-color .2s ease; }
    button:not(:disabled):hover { transform: translateY(-1px); }

    .status-pulse { animation: glowPulse 1.8s ease-in-out infinite; }
    .reveal { animation: reveal .55s both; }
    .delay-1 { animation-delay: .08s; }
    .delay-2 { animation-delay: .16s; }
    .delay-3 { animation-delay: .24s; }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: .5; transform: scale(.82); box-shadow: 0 0 0 0 rgba(110, 242, 182, .42); }
      50% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 7px rgba(110, 242, 182, 0); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--field);
      color: var(--text);
      padding: 11px 13px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .field:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 4px rgba(25, 199, 124, .13);
    }

    .field::placeholder { color: var(--muted); opacity: .78; }
    .field option { background: var(--panel-deep); color: var(--text); }

    .subject-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(110, 242, 182, .23);
      border-radius: 999px;
      padding: 7px 9px 7px 11px;
      color: var(--mint);
      background: rgba(25, 199, 124, .12);
      font-size: .78rem;
      font-weight: 700;
    }

    .subject-chip button {
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      color: currentColor;
      background: transparent;
      cursor: pointer;
      opacity: .68;
      transition: opacity .18s ease;
    }

    .subject-chip button:hover { opacity: 1; }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(53, minmax(7px, 1fr));
      grid-template-rows: repeat(7, 10px);
      grid-auto-flow: column;
      gap: 4px;
      min-width: 645px;
    }

    .heat-cell {
      border-radius: 3px;
      background: rgba(158, 192, 179, .12);
      transition: transform .16s ease, filter .16s ease;
    }

    .heat-cell:hover {
      z-index: 2;
      transform: scale(1.52);
      filter: brightness(1.25);
    }

    .heat-1 { background: rgba(25, 199, 124, .27); }
    .heat-2 { background: rgba(25, 199, 124, .48); }
    .heat-3 { background: rgba(25, 199, 124, .72); }
    .heat-4 { background: #72f4bd; box-shadow: 0 0 9px rgba(110, 242, 182, .46); }

    .timeline-item {
      position: relative;
      padding-left: 28px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      top: 22px;
      bottom: -17px;
      left: 5px;
      width: 1px;
      background: var(--line);
    }

    .timeline-item:last-child::before { display: none; }

    .timeline-dot {
      position: absolute;
      z-index: 1;
      top: 17px;
      left: 0;
      width: 11px;
      height: 11px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 15px rgba(110, 242, 182, .75);
    }

    .hidden-view { display: none !important; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px;
    }

    @media (max-width: 720px) {

        <div class="mb-5 flex items-center justify-between">
         <div>
          <p data-template-id="timeline-kicker" class="canva-text mono-font text-[10px] font-bold uppercase tracking-[.19em]"></p>
          <h2 data-template-id="timeline-title" class="canva-text brand-font mt-1 font-bold"></h2>
          <p data-template-id="timeline-helper" class="canva-text mt-1 text-sm"></p>
         </div><i data-lucide="history" class="h-5 w-5 text-emerald-300"></i>
        </div>
        <div id="timeline-list" class="space-y-3" aria-live="polite">
         <div id="empty-timeline" class="rounded-2xl border border-dashed px-4 py-10 text-center text-sm" style="border-color:var(--line); color:var(--muted)">
          <i data-lucide="calendar-plus" class="mx-auto mb-3 h-6 w-6 text-emerald-300"></i> <span data-template-id="empty-timeline-text" class="canva-text"></span>
         </div>
        </div><button id="load-more" type="button" class="hidden-view mt-5 w-full items-center justify-center gap-2 rounded-xl border px-4 py-3 text-sm font-bold transition hover:border-emerald-400" style="border-color:var(--line); color:var(--text)"> <span id="load-more-label" data-template-id="load-more-label" class="canva-text"></span> <span id="load-more-count"></span> <i data-lucide="chevron-down" class="h-4 w-4"></i> </button>
       </section>
      </section>
     </div>
    </main>
   </div>
  </div>
  <template id="timeline-template">
   <article class="timeline-item">
    <span class="timeline-dot"></span>
    <div class="rounded-2xl border p-4 transition hover:-translate-y-0.5" style="border-color:var(--line); background:var(--field)">
     <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
       <span class="session-subject inline-flex rounded-full px-2.5 py-1 text-xs font-bold"></span>
       <h3 class="session-topic brand-font mt-2 font-bold"></h3>
      </div><span class="session-date text-xs font-semibold" style="color:var(--muted)"></span>
     </div>
     <div class="mt-3 flex items-center gap-2 text-xs" style="color:var(--muted)">
      <i data-lucide="clock-3" class="h-3.5 w-3.5 text-emerald-300"></i> <span class="session-duration"></span>
     </div>
     <p class="session-notes mt-2 text-sm leading-relaxed" style="color:var(--muted)"></p>
    </div>
   </article>
  </template>
  <script>
    const state = {
      records: [],
      subjects: ["React", "Python", "Algorithms"],
      visibleCount: 5,
      filter: "all"
    };

    const $ = (id) => document.getElementById(id);
    const today = new Date().toISOString().slice(0, 10);
    $("session-date").value = today;

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function formatDate(value) {
      return new Date(value + "T12:00:00").toLocaleDateString("en", {
        month: "short", day: "numeric", year: "numeric"
      });
    }

    function formatHours(minutes) {
      if (minutes < 60) return `${minutes}m`;
      const hours = minutes / 60;
      return `${hours % 1 === 0 ? hours : hours.toFixed(1)}h`;
    }

    function showMessage(message, type) {
      const messageEl = $("form-message");
      messageEl.textContent = message;
      messageEl.style.color = type === "error" ? "#fb7185" : "#6ef2b6";
      messageEl.classList.remove("hidden-view");
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => messageEl.classList.add("hidden-view"), 4200);
    }

    function updateSubjectsFromRecords() {
      state.records.forEach((record) => {
        if (record.subject && !state.subjects.some((subject) => subject.toLowerCase() === record.subject.toLowerCase())) {
          state.subjects.push(record.subject);
        }
      });
    }

    function renderSubjects() {
      const tags = $("subject-tags");
      tags.innerHTML = "";

      state.subjects.forEach((subject) => {
        const chip = document.createElement("span");
        chip.className = "subject-chip";
        chip.innerHTML = `<span>${escapeHtml(subject)}</span><button type="button" aria-label="Remove ${escapeHtml(subject)}"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>`;

        chip.querySelector("button").addEventListener("click", () => {
          if (state.subjects.length <= 1) {
            showMessage("Keep at least one subject available.", "error");
            return;
          }
          state.subjects = state.subjects.filter((item) => item !== subject);
          renderSubjects();
          renderSubjectSelects();
        });

        tags.appendChild(chip);
      });

      lucide.createIcons();
    }

    function renderSubjectSelects() {
      const currentSessionSubject = $("session-subject").value;
      const currentFilter = $("heatmap-filter").value || state.filter;

      $("session-subject").innerHTML = state.subjects
        .map((subject) => `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`)
        .join("");

      if (state.subjects.includes(currentSessionSubject)) {
        $("session-subject").value = currentSessionSubject;
      }

      $("heatmap-filter").innerHTML =
        `<option value="all">All subjects</option>` +
        state.subjects.map((subject) => `<option value="${escapeHtml(subject)}">${escapeHtml(subject)}</option>`).join("");

      $("heatmap-filter").value = state.subjects.includes(currentFilter) ? currentFilter : "all";
    }

    function calculateStats() {
      const totalMinutes = state.records.reduce((total, record) => total + (Number(record.minutes) || 0), 0);
      const activeDates = new Set(state.records.map((record) => record.session_date));
      const current = new Date(today + "T12:00:00");
      let streak = 0;

      while (activeDates.has(current.toISOString().slice(0, 10))) {
        streak += 1;
        current.setDate(current.getDate() - 1);
      }

      const weekStart = new Date(today + "T00:00:00");
      weekStart.setDate(weekStart.getDate() - 6);

      const weekMinutes = state.records
        .filter((record) => new Date(record.session_date + "T00:00:00") >= weekStart)
        .reduce((total, record) => total + Number(record.minutes || 0), 0);

      $("stat-streak").textContent = String(streak);
      $("stat-week").textContent = formatHours(weekMinutes);
      $("stat-total").textContent = formatHours(totalMinutes);
      $("stat-active").textContent = String(activeDates.size);
    }

    function renderHeatmap() {
      const grid = $("heatmap-grid");
      grid.innerHTML = "";

      const selectedSubject = $("heatmap-filter").value;
      const totals = {};

      state.records
        .filter((record) => selectedSubject === "all" || record.subject === selectedSubject)
        .forEach((record) => {
          totals[record.session_date] = (totals[record.session_date] || 0) + Number(record.minutes || 0);
        });

      const start = new Date(today + "T12:00:00");
      start.setDate(start.getDate() - 370);

      for (let index = 0; index < 371; index += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        const key = date.toISOString().slice(0, 10);
        const minutes = totals[key] || 0;
        let level = 0;

        if (minutes > 0 && minutes <= 30) level = 1;
        else if (minutes <= 60) level = 2;
        else if (minutes <= 120) level = 3;
        else if (minutes > 120) level = 4;

        const cell = document.createElement("span");
        cell.className = `heat-cell ${level ? `heat-${level}` : ""}`;
        cell.title = `${key}: ${minutes ? `${minutes} minutes` : "No activity"}`;
        grid.appendChild(cell);
      }

      $("heatmap-months").innerHTML = ["Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep"]
        .map((month) => `<span>${month}</span>`)
        .join("");
    }

    function renderTimeline() {
      const list = $("timeline-list");
      const emptyState = $("empty-timeline");
      
      // 1. FILTER the records before sorting based on the current active filter
      const filteredRecords = state.filter === "all" 
        ? state.records 
        : state.records.filter((record) => record.subject === state.filter);

      // 2. Sort the filtered array
      const sortedRecords = [...filteredRecords].sort((a, b) =>
        new Date(b.session_date) - new Date(a.session_date) || new Date(b.created_at) - new Date(a.created_at)
      );

      list.querySelectorAll(".timeline-item").forEach((item) => item.remove());
      const visibleRecords = sortedRecords.slice(0, state.visibleCount);

      if (!visibleRecords.length) {
        emptyState.classList.remove("hidden-view");
      } else {
        emptyState.classList.add("hidden-view");

        visibleRecords.forEach((record) => {
          const node = $("timeline-template").content.cloneNode(true);
          node.querySelector(".session-subject").textContent = record.subject;
          node.querySelector(".session-subject").style.background = "rgba(25, 199, 124, .13)";
          node.querySelector(".session-subject").style.color = "var(--mint)";
          node.querySelector(".session-topic").textContent = record.topic;
          node.querySelector(".session-date").textContent = formatDate(record.session_date);
          node.querySelector(".session-duration").textContent = `${record.minutes} minutes focused`;
          node.querySelector(".session-notes").textContent = record.notes || "No notes added for this session.";
          list.appendChild(node);
        });
      }

      const remaining = Math.max(0, sortedRecords.length - state.visibleCount);
      const loadMore = $("load-more");
      $("load-more-count").textContent = remaining ? `(${remaining})` : "";
      loadMore.classList.toggle("hidden-view", remaining === 0);
      loadMore.classList.toggle("flex", remaining > 0);
      lucide.createIcons();
    }

    function setSavingState(isSaving) {
      $("save-session").disabled = isSaving;
      $("save-session-idle").classList.toggle("hidden-view", isSaving);
      $("save-session-loading").classList.toggle("hidden-view", !isSaving);
    }

    function setTheme(isLight) {
      document.body.classList.toggle("light-mode", isLight);
      $("light-mode-label").classList.toggle("hidden-view", isLight);
      $("dark-mode-label").classList.toggle("hidden-view", !isLight);
    }

    const handler = {
      onDataChanged(data) {
        state.records = data;
        updateSubjectsFromRecords();
        renderSubjects();
        renderSubjectSelects();
        calculateStats();
        renderHeatmap();
        renderTimeline();
      }
    };

    $("subject-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = $("subject-name");
      const name = input.value.trim();

      if (!name) return;

      if (state.subjects.some((subject) => subject.toLowerCase() === name.toLowerCase())) {
        showMessage("That subject is already in your workspace.", "error");
        return;
      }

      state.subjects.push(name);
      input.value = "";
      renderSubjects();
      renderSubjectSelects();
    });

    $("heatmap-filter").addEventListener("change", () => {
      state.filter = $("heatmap-filter").value;
      
      // RESET the visible timeline limit when a new filter is selected
      state.visibleCount = 5; 
      
      renderHeatmap();
      renderTimeline(); // CALL renderTimeline so the UI updates
    });

    $("load-more").addEventListener("click", () => {
      state.visibleCount += 5;
      renderTimeline();
    });

    $("theme-toggle").addEventListener("click", () => {
      setTheme(!document.body.classList.contains("light-mode"));
    });

    $("session-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const topic = $("session-topic").value.trim();
      const minutes = Number($("session-minutes").value);

      if (!topic || !minutes || minutes < 1) {
        showMessage("Add a topic and a valid study duration to continue.", "error");
        return;
      }

      if (state.records.length >= 999) {
        showMessage("Your Learning Ledger has reached the 999 session limit. Remove sessions before adding more.", "error");
        return;
      }

      setSavingState(true);

      const result = await window.dataSdk.create({
        subject: $("session-subject").value,
        topic,
        minutes,
        notes: $("session-notes").value.trim(),
        session_date: $("session-date").value,
        created_at: new Date().toISOString()
      });

      setSavingState(false);

      if (result.isOk) {
        $("session-form").reset();
        $("session-date").value = today;
        state.visibleCount = 5;
        showMessage("Session saved to your Learning Ledger.", "success");
      } else {
        showMessage("Your session could not be saved. Please try again.", "error");
      }
    });

    async function initialize() {
      setTheme(false);
      renderSubjects();
      renderSubjectSelects();
      renderHeatmap();
      renderTimeline();
      lucide.createIcons();

      const result = await window.dataSdk.init(handler);
      if (!result.isOk) {
        showMessage("Learning Ledger could not connect to your saved sessions.", "error");
      }
    }

    initialize();
  </script>
 </body>
</html>
