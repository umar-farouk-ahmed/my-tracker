<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c2b2d;
        --paper: #faf8f3;
        --card: #ffffff;
        --line: #e5e0d5;
        --amber: #c4632c;
        --sage: #6f8a7d;
        --muted: #8a8478;
      }
      body { font-family: "Inter", sans-serif; background: var(--paper); color: var(--ink); }
      h1, h2, .display { font-family: "Space Grotesk", sans-serif; }
      .heatmap-grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
      .day-cell { width: 12px; height: 12px; background: #ece7dc; border-radius: 2px; cursor: default; transition: transform .1s ease; }
      .day-cell[data-count]:not([data-count="0"]) { cursor: pointer; }
      .day-cell:hover { transform: scale(1.35); }
      .day-cell.l1 { background: #d9c2a8; }
      .day-cell.l2 { background: #cf8f56; }
      .day-cell.l3 { background: var(--amber); }
      .day-cell.l4 { background: #8a3f18; }
      .heatmap-scroll { overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
      .heatmap-scroll::-webkit-scrollbar { height: 5px; }
      .heatmap-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
      #tooltip { position: absolute; background: var(--ink); color: #fff; padding: 5px 9px; border-radius: 5px; font-size: 11.5px; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 50; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }
      .loader { border: 2.5px solid #e5e0d5; border-top: 2.5px solid var(--amber); border-radius: 50%; width: 16px; height: 16px; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .toast { transform: translateY(24px); opacity: 0; }
      .toast.show { transform: translateY(0); opacity: 1; }
      .log-row:hover .del-btn { opacity: 1; }
      .del-btn { opacity: 0; transition: opacity .15s; }
    </style>
  </head>
  <body class="min-h-screen py-8 px-4 sm:px-8">
    <div class="max-w-5xl mx-auto space-y-6">

      <header class="flex justify-between items-start">
        <div>
          <h1 class="text-3xl font-semibold tracking-tight">Learning Ledger</h1>
          <p class="text-sm mt-1" style="color: var(--muted)">Every session, logged. Consistency compounds.</p>
        </div>
        <div id="status-indicator" class="flex items-center gap-2 text-xs mt-2" style="color: var(--muted)">
          <div class="loader" id="loading-spinner"></div>
          <span id="status-text">Connecting…</span>
        </div>
      </header>

      <!-- Stats -->
      <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="p-4 rounded-xl border" style="background: var(--card); border-color: var(--line)">
          <div class="text-2xl font-semibold display" id="stat-streak">0</div>
          <div class="text-xs mt-0.5" style="color: var(--muted)">Day streak</div>
        </div>
        <div class="p-4 rounded-xl border" style="background: var(--card); border-color: var(--line)">
          <div class="text-2xl font-semibold display" id="stat-week">0</div>
          <div class="text-xs mt-0.5" style="color: var(--muted)">Sessions this week</div>
        </div>
        <div class="p-4 rounded-xl border" style="background: var(--card); border-color: var(--line)">
          <div class="text-2xl font-semibold display" id="stat-total">0</div>
          <div class="text-xs mt-0.5" style="color: var(--muted)">Total sessions</div>
        </div>
        <div class="p-4 rounded-xl border" style="background: var(--card); border-color: var(--line)">
          <div class="text-2xl font-semibold display" id="stat-days">0</div>
          <div class="text-xs mt-0.5" style="color: var(--muted)">Active days</div>
        </div>
      </section>

      <!-- Heatmap -->
      <section class="p-6 rounded-2xl border relative" style="background: var(--card); border-color: var(--line)">
        <h2 class="text-base font-semibold mb-4">Last 365 days</h2>
        <div class="heatmap-scroll relative" id="heatmap-scroll-area">
          <div class="flex gap-3">
            <div class="flex flex-col justify-between text-[11px] py-1" style="height: 90px; color: var(--muted)">
              <span>Mon</span><span>Wed</span><span>Fri</span>
            </div>
            <div id="heatmap" class="heatmap-grid pb-1"></div>
          </div>
        </div>
        <div id="tooltip"></div>
        <div class="flex items-center justify-end text-[11px] mt-2 gap-1.5" style="color: var(--muted)">
          <span>Less</span>
          <div class="w-2.5 h-2.5 rounded-sm" style="background:#ece7dc"></div>
          <div class="w-2.5 h-2.5 rounded-sm" style="background:#d9c2a8"></div>
          <div class="w-2.5 h-2.5 rounded-sm" style="background:#cf8f56"></div>
          <div class="w-2.5 h-2.5 rounded-sm" style="background:#c4632c"></div>
          <div class="w-2.5 h-2.5 rounded-sm" style="background:#8a3f18"></div>
          <span>More</span>
        </div>
      </section>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Form -->
        <section class="md:col-span-1 p-6 rounded-2xl border h-fit" style="background: var(--card); border-color: var(--line)">
          <h2 class="text-base font-semibold mb-4">Log a session</h2>
          <form id="log-form" class="space-y-3">
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--muted)">Date</label>
              <input type="date" id="log-date" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2" style="border-color: var(--line); --tw-ring-color: var(--amber)" />
            </div>
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--muted)">Course</label>
              <input type="text" id="log-course" placeholder="e.g. React, Python" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2" style="border-color: var(--line); --tw-ring-color: var(--amber)" />
            </div>
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--muted)">Topic covered</label>
              <input type="text" id="log-topic" placeholder="e.g. Hooks, Loops" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2" style="border-color: var(--line); --tw-ring-color: var(--amber)" />
            </div>
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--muted)">Minutes spent</label>
              <input type="number" id="log-minutes" placeholder="30" min="1" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2" style="border-color: var(--line); --tw-ring-color: var(--amber)" />
            </div>
            <div>
              <label class="block text-xs font-medium mb-1" style="color: var(--muted)">Notes (optional)</label>
              <textarea id="log-notes" rows="2" placeholder="Brief summary…" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 resize-none" style="border-color: var(--line); --tw-ring-color: var(--amber)"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="w-full text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center gap-2" style="background: var(--ink)">
              Save session
            </button>
          </form>
        </section>

        <!-- Logs -->
        <section class="md:col-span-2 p-6 rounded-2xl border" style="background: var(--card); border-color: var(--line)">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-semibold">Recent sessions</h2>
            <input type="text" id="filter-course" placeholder="Filter by course…" class="text-sm px-3 py-1.5 border rounded-lg outline-none w-40" style="border-color: var(--line)" />
          </div>
          <div id="logs-container" class="space-y-2 max-h-[440px] overflow-y-auto pr-1">
            <p class="text-sm italic" style="color: var(--muted)">Loading sessions…</p>
          </div>
        </section>
      </div>
    </div>

    <div id="toast" class="toast fixed bottom-4 right-4 text-white px-5 py-3 rounded-lg shadow-lg z-50 text-sm" style="background: var(--ink)">
      <span id="toast-msg">Saved</span>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import {
        getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy,
      } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB3ZLk2sK28LY0OP727Kpxu0xsCrfZksYs",
        authDomain: "learning-tracker-9a1e1.firebaseapp.com",
        projectId: "learning-tracker-9a1e1",
        storageBucket: "learning-tracker-9a1e1.firebasestorage.app",
        messagingSenderId: "933272881617",
        appId: "1:933272881617:web:f9541d767ce37c77e9b8f0",
        measurementId: "G-MJTQYNYE5H",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const logsCol = collection(db, "logs");

      const statusText = document.getElementById("status-text");
      const spinner = document.getElementById("loading-spinner");
      const dateInput = document.getElementById("log-date");
      dateInput.valueAsDate = new Date();

      let allLogs = [];

      function showToast(msg) {
        const t = document.getElementById("toast");
        document.getElementById("toast-msg").textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      function dayKey(d) {
        const dt = new Date(d);
        return dt.toISOString().slice(0, 10);
      }

      function computeStats(logs) {
        const counts = {};
        logs.forEach((l) => { const k = dayKey(l.timestamp); counts[k] = (counts[k] || 0) + 1; });
        const activeDays = Object.keys(counts).length;

        // streak: consecutive days up to today (or yesterday if today not yet logged)
        let streak = 0;
        let cursor = new Date();
        cursor.setHours(0, 0, 0, 0);
        if (!counts[dayKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
        while (counts[dayKey(cursor)]) {
          streak++;
          cursor.setDate(cursor.getDate() - 1);
        }

        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        const weekCount = logs.filter((l) => new Date(l.timestamp) >= weekAgo).length;

        document.getElementById("stat-streak").textContent = streak;
        document.getElementById("stat-week").textContent = weekCount;
        document.getElementById("stat-total").textContent = logs.length;
        document.getElementById("stat-days").textContent = activeDays;
        return counts;
      }

      function renderHeatmap(counts) {
        const grid = document.getElementById("heatmap");
        grid.innerHTML = "";
        const tooltip = document.getElementById("tooltip");
        const scrollArea = document.getElementById("heatmap-scroll-area");
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const start = new Date(today);
        start.setDate(start.getDate() - 364);
        // align start to Monday
        const offset = (start.getDay() + 6) % 7;
        start.setDate(start.getDate() - offset);

        for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
          const key = dayKey(d);
          const count = counts[key] || 0;
          const cell = document.createElement("div");
          cell.classList.add("day-cell");
          cell.dataset.count = count;
          if (count >= 4) cell.classList.add("l4");
          else if (count === 3) cell.classList.add("l3");
          else if (count === 2) cell.classList.add("l2");
          else if (count === 1) cell.classList.add("l1");

          cell.addEventListener("mouseenter", (e) => {
            const rect = e.target.getBoundingClientRect();
            const areaRect = scrollArea.getBoundingClientRect();
            tooltip.textContent = `${count} session${count === 1 ? "" : "s"} — ${new Date(d).toLocaleDateString()}`;
            tooltip.style.left = rect.left - areaRect.left + scrollArea.scrollLeft + rect.width / 2 + "px";
            tooltip.style.top = rect.top - areaRect.top + "px";
            tooltip.style.opacity = "1";
          });
          cell.addEventListener("mouseleave", () => { tooltip.style.opacity = "0"; });
          grid.appendChild(cell);
        }
        scrollArea.scrollLeft = scrollArea.scrollWidth;
      }

      function renderLogs(logs, filter) {
        const container = document.getElementById("logs-container");
        const filtered = filter
          ? logs.filter((l) => l.course.toLowerCase().includes(filter.toLowerCase()))
          : logs;

        if (filtered.length === 0) {
          container.innerHTML = `<p class="text-sm italic" style="color: var(--muted)">No sessions yet — log your first one.</p>`;
          return;
        }

        container.innerHTML = "";
        filtered.forEach((log) => {
          const row = document.createElement("div");
          row.className = "log-row flex items-start justify-between gap-3 p-3 rounded-lg border";
          row.style.borderColor = "var(--line)";
          const dateStr = new Date(log.timestamp).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
          row.innerHTML = `
            <div class="min-w-0">
              <div class="flex items-baseline gap-2 flex-wrap">
                <span class="font-medium">${log.course}</span>
                <span class="text-xs" style="color: var(--muted)">${dateStr}${log.minutes ? " · " + log.minutes + " min" : ""}</span>
              </div>
              <div class="text-sm mt-0.5">${log.topic}</div>
              ${log.notes ? `<div class="text-xs mt-1" style="color: var(--muted)">${log.notes}</div>` : ""}
            </div>
            <button class="del-btn text-xs px-2 py-1 rounded" style="color: var(--amber)" data-id="${log.id}">Remove</button>
          `;
          row.querySelector(".del-btn").addEventListener("click", async (e) => {
            const id = e.target.dataset.id;
            try {
              await deleteDoc(doc(db, "logs", id));
              showToast("Session removed");
              loadLogs();
            } catch (err) {
              console.error(err);
              showToast("Couldn't remove — try again");
            }
          });
          container.appendChild(row);
        });
      }

      async function loadLogs() {
        try {
          const q = query(logsCol, orderBy("timestamp", "desc"));
          const snap = await getDocs(q);
          allLogs = [];
          snap.forEach((d) => allLogs.push({ id: d.id, ...d.data() }));

          const counts = computeStats(allLogs);
          renderHeatmap(counts);
          renderLogs(allLogs, document.getElementById("filter-course").value);

          spinner.style.display = "none";
          statusText.textContent = "Synced";
        } catch (err) {
          console.error(err);
          spinner.style.display = "none";
          statusText.textContent = "Connection error";
        }
      }

      document.getElementById("filter-course").addEventListener("input", (e) => {
        renderLogs(allLogs, e.target.value);
      });

      document.getElementById("log-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submit-btn");
        const course = document.getElementById("log-course").value.trim();
        const topic = document.getElementById("log-topic").value.trim();
        const notes = document.getElementById("log-notes").value.trim();
        const minutes = document.getElementById("log-minutes").value;
        const dateVal = dateInput.valueAsDate || new Date();
        const timestamp = dateVal.toISOString();

        btn.disabled = true;
        btn.textContent = "Saving…";
        try {
          await addDoc(logsCol, {
            course, topic, notes: notes || null,
            minutes: minutes ? Number(minutes) : null,
            timestamp,
          });
          document.getElementById("log-form").reset();
          dateInput.valueAsDate = new Date();
          showToast("Session logged");
          loadLogs();
        } catch (err) {
          console.error(err);
          showToast("Couldn't save — check console");
        } finally {
          btn.disabled = false;
          btn.textContent = "Save session";
        }
      });

      loadLogs();
    </script>
  </body>
</html>
